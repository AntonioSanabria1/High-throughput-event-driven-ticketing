<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticketmaster - Minimalist</title>
    <!-- Fuente tipográfica moderna, fina y minimalista -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }
        
        body {
            background-color: #ffffff;
            color: #111111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            transition: background-color 0.5s ease;
        }

        .container {
            width: 100%;
            max-width: 380px;
            text-align: center;
            padding: 40px;
        }

        /* ===== ESTADOS (PANTALLAS) ===== */
        .state {
            display: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .state.active {
            display: block;
            opacity: 1;
        }

        /* ===== ESTADO: INICIO (COMPRA) ===== */
        h1 {
            font-weight: 300;
            font-size: 1.25rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #888888;
            margin-bottom: 20px;
        }

        .stock-number {
            font-weight: 200;
            font-size: 5rem;
            color: #000000;
            line-height: 1;
        }

        .stock-label {
            font-weight: 400;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #aaaaaa;
            margin-top: 10px;
            margin-bottom: 50px;
        }

        button.btn-black {
            background-color: #000000;
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 16px;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            border-radius: 4px;
        }

        button.btn-black:hover:not(:disabled) {
            background-color: #333333;
        }

        button.btn-black:active:not(:disabled) {
            transform: scale(0.98);
        }

        button:disabled {
            background-color: #eeeeee;
            color: #999999;
            cursor: not-allowed;
        }

        /* ===== ESTADOS DE CARGA Y RESULTADO COEXISTIENDO ===== */
        .dynamic-icon {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 30px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .spinner {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 1px solid #eeeeee;
            border-top: 1px solid #000000;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .spinner.fade-out {
            opacity: 0;
            transform: scale(0.8);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .mark {
            position: absolute;
            font-size: 5rem;
            font-weight: 200;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .mark.show {
            opacity: 1;
            transform: scale(1);
        }

        .icon-success {
            color: #10b981; /* Verde minimalista */
        }

        .icon-error {
            color: #ef4444; /* Rojo minimalista */
        }

        .status-text {
            font-weight: 300;
            font-size: 1.1rem;
            color: #555555;
            letter-spacing: 1px;
            margin-bottom: 40px;
            transition: opacity 0.3s;
        }

        button.btn-outline {
            background-color: transparent;
            color: #000000;
            border: 1px solid #000000;
            width: 100%;
            padding: 16px;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background-color 0.3s, color 0.3s;
            border-radius: 4px;
        }

        button.btn-outline:hover {
            background-color: #000000;
            color: #ffffff;
        }

        /* Controles Administrador */
        #adminBtn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: none;
            border: none;
            color: #cccccc;
            font-size: 0.7rem;
            cursor: pointer;
            letter-spacing: 1px;
            transition: color 0.3s;
        }
        
        #adminBtn:hover {
            color: #000000;
        }
    </style>
</head>
<body>

    <button id="adminBtn" onclick="rellenarEstadio()">REINICIAR INVENTARIO (ADMIN)</button>

    <div class="container">
        
        <!-- PANTALLA 1: INICIO -->
        <div id="state-idle" class="state active">
            <h1>Concierto VIP</h1>
            <div class="stock-number" id="stockDisplay">-</div>
            <div class="stock-label">Boletos Disponibles</div>
            <button class="btn-black" id="btnBuy" onclick="comprarBoleto()">Comprar Boleto</button>
        </div>

        <!-- PANTALLA 2 Y 3 JUNTAS: TRANSACCIÓN ACTIVA -->
        <div id="state-transaction" class="state">
            <div class="dynamic-icon">
                <div id="theSpinner" class="spinner"></div>
                <div id="theMark" class="mark">✓</div>
            </div>
            
            <div id="statusText" class="status-text">Procesando pago seguro...</div>
            
            <button id="btnVolver" class="btn-outline" onclick="volverInicio()" style="display:none;">Volver</button>
        </div>

    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000/api/v1";
        
        // Elementos UI
        const stateIdle = document.getElementById('state-idle');
        const stateTransaction = document.getElementById('state-transaction');

        const stockDisplay = document.getElementById('stockDisplay');
        const btnBuy = document.getElementById('btnBuy');
        
        const theSpinner = document.getElementById('theSpinner');
        const theMark = document.getElementById('theMark');
        const statusText = document.getElementById('statusText');
        const btnVolver = document.getElementById('btnVolver');

        let peticionEnCurso = false;

        // Control de vistas DOM
        function setScreen(screenId) {
            document.querySelectorAll('.state').forEach(el => el.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // Cliente HTTP para consultar stock global
        async function fetchStock() {
            try {
                const response = await fetch(`${API_URL}/stock`);
                if (response.ok) {
                    const data = await response.json();
                    stockDisplay.innerText = data.stock_disponible;
                    
                    if (data.stock_disponible <= 0 && !peticionEnCurso) {
                        btnBuy.disabled = true;
                        btnBuy.innerText = "AGOTADO";
                    } else if (!peticionEnCurso && (btnBuy.disabled || btnBuy.innerText === "AGOTADO")) {
                        btnBuy.disabled = false;
                        btnBuy.innerText = "COMPRAR BOLETO";
                    }
                }
            } catch (error) {
                console.error("FastAPI off:", error);
            }
        }

        // Función principal de emisión de solicitud de compra
        async function comprarBoleto() {
            peticionEnCurso = true;
            
            // Entramos a modo de carga
            setScreen('state-transaction');
            theSpinner.classList.remove('fade-out'); // Girar visible
            theMark.classList.remove('show'); // Esconder palomita o tache
            btnVolver.style.display = 'none';
            statusText.innerText = "Enviando petición a FastAPI...";

            const usuarioRandom = Math.floor(Math.random() * 1000) + 1;

            try {
                // Transmisión asíncrona a API Gateway
                const response = await fetch(`${API_URL}/comprar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario_id: usuarioRandom, ticket_id: 1 })
                });

                const data = await response.json();

                if (response.ok) {
                    statusText.innerText = "Autorizando cobro con el banco...";
                    
                    // Subscripción a canal SSE para notificaciones del Worker
                    const eventSource = new EventSource(`${API_URL}/notificaciones/${usuarioRandom}`);
                    
                    eventSource.onmessage = function(event) {
                        const sseData = JSON.parse(event.data);
                        
                        // Evaluación del estado del Worker
                        if (sseData.status === "aprobado") {
                            mostrarResultado("✓", "Aprobado", "icon-success");
                        } else {
                            mostrarResultado("✕", "Rechazado", "icon-error");
                        }
                        eventSource.close(); // Cierre de conexión persistente
                    };
                    
                    eventSource.onerror = function() {
                        eventSource.close();
                        mostrarResultado("⚠", "Error SSE", "icon-error");
                    };

                } else {
                    mostrarResultado("✕", "Agotado", "icon-error");
                }
            } catch (error) {
                mostrarResultado("⚠", "Error de red", "icon-error");
            }
        }

        function mostrarResultado(iconoTexto, titulo, claseColor) {
            peticionEnCurso = false;
            fetchStock();
            
            // Orquestación de animaciones CSS in-place
            theSpinner.classList.add('fade-out'); // Desvanecer indicador de red
            
            theMark.innerText = iconoTexto;
            theMark.className = `mark ${claseColor}`;
            
            // Trigger forzado de DOM Reflow para reiniciar animaciones
            void theMark.offsetWidth;
            theMark.classList.add('show'); // Presentar feedback visual
            
            statusText.innerText = titulo;
            btnVolver.style.display = 'block';
        }

        function volverInicio() {
            setScreen('state-idle');
        }

        // Restablecimiento de variables de entorno controladas
        async function rellenarEstadio() {
            try {
                const response = await fetch(`${API_URL}/admin/reset`, { method: 'POST' });
                if (response.ok) {
                    fetchStock();
                }
            } catch (error) {}
        }

        // Polling constante para sincronización de inventario distribuido
        setInterval(fetchStock, 1000);
        fetchStock();
    </script>
</body>
</html>
